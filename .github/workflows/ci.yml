name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "feat/**"
      - "codex/**"
  pull_request:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists changed PR files via the API

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Meta checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Repository hygiene
        run: ./scripts/check-repository-hygiene.sh

      - name: TestFlight notes
        run: |
          ./scripts/ios-release-notes-check.sh
          ./scripts/ios-release-notes-test.sh

      - name: Google Play notes
        run: ./scripts/android-play-release-notes-check.sh

      - name: Require reviewed notes for TestFlight-triggering pull requests
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if grep -Eq '^(Sources/|Tests/|ios/|Package\.swift$|scripts/|justfile$)' <<< "$changed_files"; then
            if ! grep -Fxq 'ios/TestFlight/WhatToTest.en-US.txt' <<< "$changed_files"; then
              echo "Update ios/TestFlight/WhatToTest.en-US.txt with plain-language changes and test steps." >&2
              exit 1
            fi
          fi

      - name: Require reviewed notes for Play-triggering pull requests
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if grep -Eq '^(Apps/Android/|Sources/OpenZCine(Core|AndroidFacade)/|scripts/android-|scripts/verify-android-|scripts/ci-install-swift-android\.sh$|justfile$|\.github/workflows/play-internal\.yml$)' <<< "$changed_files"; then
            if ! grep -Fxq 'Apps/Android/distribution/whatsnew/whatsnew-en-US' <<< "$changed_files"; then
              echo "Update Apps/Android/distribution/whatsnew/whatsnew-en-US with plain-language changes for Play testers." >&2
              exit 1
            fi
          fi

      - name: Spell check
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

      - name: Link check
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: "--no-progress --offline --exclude-path vendor --exclude-path ref --exclude-path docs/design ."
          fail: true

      - name: EditorConfig check
        uses: editorconfig-checker/action-editorconfig-checker@7e30171fc973d78099d7dfc78e27c07d3c4a639f # v2
        with:
          # editorconfig-checker v4 renamed its release assets (ec-* → editorconfig-checker-*),
          # which the v2 action's "latest" lookup cannot find. Pin the last v3 release.
          version: v3.11.3

      - name: Actionlint
        # Digest-pinned for reproducibility. Update the version manually when needed. v1.7.12
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: "-color"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        # Digest-pinned for reproducibility. Update the version manually when needed. v8.30.1
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: "detect --source=. --redact --no-banner --config=.gitleaks.toml"

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      android: ${{ steps.filter.outputs.android }}
      bug_relay: ${{ steps.filter.outputs.bug_relay }}
      handbook: ${{ steps.filter.outputs.handbook }}
    steps:
      # `dorny/paths-filter` fetches the base ref to diff on push events, which needs the checkout's
      # git credentials — so this job keeps them (unlike the others). It runs no repository code, so
      # the token is never exposed to untrusted code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              - 'Sources/**'
              - 'Tests/**'
              - 'ios/**'
              - 'Package.swift'
              - 'opencine-pins.txt'
              - '.swift-format'
              - 'scripts/add-*.rb'
              - 'scripts/ios-*.sh'
              - 'justfile'
              # Changing how the native job builds must re-run the native job.
              - '.github/workflows/ci.yml'
            android:
              - 'Apps/Android/**'
              - 'Sources/OpenZCineCore/**'
              - 'Sources/OpenZCineAndroidFacade/**'
              - 'Package.swift'
              - 'opencine-pins.txt'
              - 'Package.resolved'
              - 'scripts/android-*.sh'
              - 'scripts/verify-android-*.sh'
              - 'scripts/ci-install-swift-android.sh'
              - 'justfile'
              # Changing the CI or Play build must re-run the Android job.
              - '.github/workflows/ci.yml'
              - '.github/workflows/play-internal.yml'
            bug_relay:
              - 'services/bug-relay/**'
              - 'justfile'
              - '.github/workflows/ci.yml'
            handbook:
              - 'handbook/**'
              - '.github/workflows/ci.yml'

  native:
    name: Native Swift/iOS
    needs: changes
    # Skip the slow macOS build for docs-only changes; Meta checks still lint the docs.
    if: ${{ needs.changes.outputs.code == 'true' }}
    # Hosted macOS: free and unlimited on public repositories, and a fresh VM per job. Never move
    # this job to a self-hosted runner — it runs `just native-check` from the pull request, so a
    # fork PR would execute attacker-controlled code on a persistent machine.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install native tooling
        run: brew install just swift-format || true
      # Candidate (OpenCine CORE-02 + MEDIA-01): Package.swift (OpenCineMedia, OpenCineNikon) and
      # ios/Runner.xcodeproj (OpenCineCore + OpenCineMedia) take the OpenCine checkout at
      # ../OpenCine, pinned by SHA in opencine-pins.txt. Works only once that repository is
      # published. Delete when the app pins it by url + version.
      - name: Check out pinned OpenCine packages next to the repository
        run: scripts/checkout-opencine.sh
      - name: Prepare a private iOS test simulator with real accessibility
        run: |
          mkdir -p "$RUNNER_TEMP/native-ios"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import plistlib
          import subprocess

          device_types = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devicetypes", "--json"]))
          device_type = next((device for device in device_types["devicetypes"]
                              if device["identifier"] == "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro"), None)
          if device_type is None:
              raise RuntimeError("The iPhone 16 Pro simulator device type is unavailable")
          runtimes = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "runtimes", "--json"]))
          available_ios = [candidate for candidate in runtimes["runtimes"]
                            if candidate.get("isAvailable", False)
                            and candidate["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]
          if not available_ios:
              raise RuntimeError("No available iOS simulator runtime")
          selected_runtime = max(available_ios, key=lambda candidate:
                                  (tuple(int(part) for part in candidate["version"].split(".")),
                                  candidate["identifier"]))
          runtime = selected_runtime["identifier"]
          name = "opc-nikon-native-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          device_id = subprocess.check_output(
              ["xcrun", "simctl", "create", name, device_type["identifier"], runtime], text=True).strip()
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("IOS_TEST_DEVICE_ID=" + device_id + "\n")
          # First boot initializes this new device's own preference store.
          subprocess.run(["xcrun", "simctl", "bootstatus", device_id, "-b"], check=True)
          subprocess.run(["xcrun", "simctl", "shutdown", device_id], check=True)
          current = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "--json"]))
          selected = next(device for devices in current["devices"].values()
                          for device in devices if device["udid"] == device_id)
          if selected["state"] != "Shutdown":
              raise RuntimeError("The private simulator must be shut down before changing preferences")
          preference = (Path.home() / "Library/Developer/CoreSimulator/Devices" / device_id
                        / "data/Library/Preferences/com.apple.Accessibility.plist")
          before = preference.read_bytes()
          original = plistlib.loads(before)
          enabled = dict(original, ApplicationAccessibilityEnabled=True, AccessibilityEnabled=True)
          preference.write_bytes(plistlib.dumps(enabled, fmt=plistlib.FMT_BINARY))
          report = {
              "deviceID": device_id, "deviceName": device_type["name"], "runtime": runtime,
              "runtimeVersion": selected_runtime["version"],
              "preferenceBeforeSHA256": hashlib.sha256(before).hexdigest(),
              "preferenceAfterSHA256": hashlib.sha256(preference.read_bytes()).hexdigest(),
              "originalValues": {key: original.get(key) for key in
                                  ["ApplicationAccessibilityEnabled", "AccessibilityEnabled"]},
              "enabledOnlyForPrivateDevice": True,
          }
          (Path(os.environ["RUNNER_TEMP"]) / "native-ios/simulator-setup.json").write_text(
              json.dumps(report, indent=2) + "\n")
          subprocess.run(["xcrun", "simctl", "bootstatus", device_id, "-b"], check=True)
          PY
      - name: Run native checks
        env:
          IOS_TEST_RESULT_BUNDLE_PATH: ${{ runner.temp }}/native-ios/Runner.xcresult
          IOS_TEST_LOG_PATH: ${{ runner.temp }}/native-ios/ios-test.log
        run: |
          mkdir -p "$RUNNER_TEMP/native-ios"
          just native-check
      - name: Delete the private iOS test simulator
        if: always()
        run: |
          if [ -n "${IOS_TEST_DEVICE_ID:-}" ]; then
            # A completed test may already have shut down its destination.
            xcrun simctl shutdown "$IOS_TEST_DEVICE_ID" || true
            xcrun simctl delete "$IOS_TEST_DEVICE_ID"
          fi
      - name: Summarize iOS test results
        if: always()
        run: |
          result_bundle="$RUNNER_TEMP/native-ios/Runner.xcresult"
          if [ -d "$result_bundle" ]; then
            xcrun xcresulttool get test-results summary --path "$result_bundle" \
              | tee "$RUNNER_TEMP/native-ios/summary.json"
          fi
      - name: Retain iOS test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ios-test-evidence
          path: |
            ${{ runner.temp }}/native-ios/Runner.xcresult
            ${{ runner.temp }}/native-ios/ios-test.log
            ${{ runner.temp }}/native-ios/summary.json
            ${{ runner.temp }}/native-ios/simulator-setup.json
          retention-days: 7
          if-no-files-found: warn

  gate:
    name: CI gate
    # The single required status check. `native` and `android` are conditional, and a required
    # check that never reports leaves a pull request blocked forever — so this job always runs and
    # collapses every other job's result into one verdict. Requiring it is also fail-closed: a pull
    # request that edits this workflow to drop a job stops reporting `CI gate` and cannot merge.
    if: always()
    needs: [meta, secrets, changes, native, android, bug-relay, handbook]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed or been deliberately skipped
        env:
          # success | failure | cancelled | skipped, one per job in `needs`.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              # `skipped` is legitimate: the paths filter proved the job had nothing to do.
              success | skipped) ;;
              *)
                echo "::error::a CI job reported '$result'"
                exit 1
                ;;
            esac
          done
          echo "All CI jobs passed or were skipped: $RESULTS"

  android:
    name: Android
    needs: changes
    # Skip the Gradle build when nothing under Apps/Android changed.
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      # Gradle caching; the runner's preinstalled Android SDK provides platform/build-tools.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Candidate (OpenCine CORE-02 + MEDIA-01): Apps/Android/settings.gradle.kts includes
      # ../../../OpenCine/Android and the Swift Android core stages OpenCineMedia and
      # OpenCineNikon (VENDOR-02) from ../OpenCine, a sibling checkout pinned by SHA in
      # opencine-pins.txt.
      - name: Check out pinned OpenCine packages next to the repository
        run: scripts/checkout-opencine.sh

      # Reuse the SHA-compliant Pocket/Insta setup for Swift 6.3.3 and NDK 27.
      # The install script configures the API 29 SDK; Gradle stages the core.
      - name: Set up Android NDK 27
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Install Swift Android SDK
        run: ./scripts/ci-install-swift-android.sh

      - name: Build, compile UI tests, unit-test, lint, and verify release packages
        working-directory: Apps/Android
        env:
          SWIFT_ANDROID_SDK_ID: swift-6.3.3-RELEASE_android
        run: ./gradlew assembleDebug :app:assembleDebugAndroidTest :wear:assembleDebugAndroidTest test lint :app:verifyReleaseNativeLibraries :wear:verifyWearReleaseArtifact

  bug-relay:
    name: Anonymous bug relay
    needs: changes
    if: ${{ needs.changes.outputs.bug_relay == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate Worker
        working-directory: services/bug-relay
        run: npm run check

  handbook:
    name: Handbook
    needs: changes
    # Build the public Starlight handbook at the base path opencapture.org serves it from.
    if: ${{ needs.changes.outputs.handbook == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: handbook/package-lock.json
      - name: Install handbook dependencies
        working-directory: handbook
        run: npm ci
      - name: Build handbook at /openzcine/docs/
        working-directory: handbook
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          HANDBOOK_BASE: /openzcine/docs
        run: npm run build
