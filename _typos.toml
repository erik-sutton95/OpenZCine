[files]
# Generated files carry pseudo-random IDs that trip typos: Xcode storyboards/projects
# (scene IDs like "tne-QT-ifu", hex UUIDs), Excalidraw scenes (element IDs like "el42ba8311"),
# and the base64 LUT table (a quarter-megabyte of encoded samples, regenerated by
# scripts/generate-builtin-lut-table.rb — a checksum test guards its contents, not a speller).
extend-exclude = [
    "vendor/**",
    "ref/**",
    "graphify-out/**",
    "CHANGELOG.md",
    "*.lock",
    "**/*.storyboard",
    "**/*.pbxproj",
    "**/*.excalidraw",
    "Sources/OpenZCineCore/MonitorLUTContributedTable.swift",
]

[default.extend-words]
# Camera / protocol domain terms that are not misspellings.
ZR = "ZR"
MTP = "MTP"
PTP = "PTP"
UVC = "UVC"
# Retransmission timeout — a TCP term, quoted as "RTO-class stalls" in the transport docs.
RTO = "RTO"
# Simulator device identifier (not a UUID misspelling) — appears in verification recipes.
UDID = "UDID"
# Upstream libgphoto2 symbol name (ptp.h) reproduced verbatim for interop provenance —
# misspelled at the source, so it must be quoted as-is.
Flourescent = "Flourescent"

[default]
# Cinema/imaging tokens that appear inside identifiers or comments (R3D NE, ND filter, PNG).
extend-ignore-re = [
    "R3DNE",
    "ND'd",
    "PNGs?",
    # "mis-" is an English prefix, not a truncated "miss"/"mist" — mis-tags, mis-assign,
    # mis-weights. Hyphen-bounded so a bare "mis" is still caught.
    "mis-[a-z]+",
    # A comment quoting how a label letter-wrapped when squeezed. The broken word is the point.
    "Activ / e",
]
